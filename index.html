<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta VIP | Sergio Zaldivar</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #050505;
            background-image: 
                linear-gradient(rgba(212, 175, 55, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: moveGrid 15s linear infinite;
            margin: 0; padding: 10px;
            font-family: 'Montserrat', sans-serif; 
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 0 40px; }
        }

        .app-container {
            width: 100%; max-width: 400px;
            background: linear-gradient(145deg, rgba(15, 15, 15, 0.9), rgba(5, 5, 5, 0.95));
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; padding: 35px 20px; box-sizing: border-box;
            border: 1px solid rgba(212, 175, 55, 0.2); 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(204, 0, 0, 0.05); 
            position: relative; z-index: 10;
        }

        .app-container::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 50%; height: 3px; 
            background: linear-gradient(90deg, #D4AF37, #CC0000, #D4AF37);
            border-radius: 0 0 10px 10px; box-shadow: 0 5px 20px rgba(204, 0, 0, 0.6);
        }

        .header { text-align: center; margin-bottom: 30px; }
        
        .logo-wrapper {
            width: 140px; height: 140px; 
            border-radius: 50%; margin: 0 auto; 
            padding: 4px; 
            background: linear-gradient(135deg, #D4AF37 0%, #8B6914 100%); 
            animation: pulseGold 3s infinite alternate;
            display: flex; justify-content: center; align-items: center;
        }
        
        @keyframes pulseGold {
            0% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
            100% { box-shadow: 0 0 35px rgba(212, 175, 55, 0.6); }
        }

        .logo-circle {
            width: 100%; height: 100%; border-radius: 50%; 
            background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .logo-circle img { width: 100%; height: 100%; object-fit: cover; }

        .virtual-card {
            background: linear-gradient(135deg, #1f1f1f 0%, #050505 100%);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 18px; padding: 25px; margin-bottom: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8), 0 0 20px rgba(204, 0, 0, 0.15); 
            position: relative; overflow: hidden;
            transform-style: preserve-3d;
        }
        
        .virtual-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(204,0,0,0.08) 50%, transparent 60%);
            animation: hologram 4s infinite linear; pointer-events: none;
        }
        @keyframes hologram { 0% { transform: translateY(-50%) translateX(-50%) rotate(0deg); } 100% { transform: translateY(50%) translateX(50%) rotate(360deg); } }

        .vc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; transform: translateZ(20px); }
        .vc-bank { font-size: 16px; font-weight: 800; color: #FFF; letter-spacing: 2px; }
        
        .vc-type { font-size: 10px; color: #D4AF37; text-transform: uppercase; font-weight: 800; letter-spacing: 2px;}
        
        .vc-number-row { text-align: center; margin: 25px 0; transform: translateZ(40px); }
        .vc-number { 
            font-family: 'Space Mono', monospace; 
            font-size: 18px; 
            color: #FFF; 
            letter-spacing: 2px; 
            white-space: nowrap; 
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        
        .vc-footer { display: flex; justify-content: space-between; align-items: flex-end; transform: translateZ(25px); }
        .vc-holder-label { font-size: 8px; color: #888; margin-bottom: 5px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px;}
        .vc-holder-name { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #D4AF37; white-space: nowrap;}
        
        .data-section { padding: 0; border: none; margin-bottom: 25px; }
        .section-title {
            display: inline-block; background-color: #0d0d0d;
            padding: 8px 15px; border-radius: 8px; border-left: 3px solid #CC0000; 
            font-size: 10px; font-weight: 800; color: #FFF; margin-bottom: 15px; 
            letter-spacing: 1px;
        }
        .section-title i { color: #CC0000; margin-right: 8px; }
        
        .data-row {
            background: linear-gradient(90deg, #0d0d0d 0%, #151515 100%);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 12px; padding: 15px;
            margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.3s ease;
        }
        .data-row:hover { border-color: rgba(204, 0, 0, 0.5); transform: translateX(5px); }
        
        .data-text { display: flex; flex-direction: column; padding-right: 15px; }
        .data-label { font-size: 9px; color: #666; margin-bottom: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .data-value { 
            font-family: 'Space Mono', monospace; 
            font-size: 14px; /* Tamaño restaurado para máxima legibilidad */
            font-weight: 700; 
            color: #FFF; 
            letter-spacing: 1px;
            word-break: break-all; /* Permite acomodarse sin desbordar */
        }
        
        .btn-outline-copy {
            background-color: rgba(212, 175, 55, 0.05); color: #D4AF37; border: 1px solid #D4AF37;
            padding: 8px 12px; border-radius: 8px; font-family: 'Montserrat', sans-serif;
            font-weight: 800; font-size: 10px; cursor: pointer; display: flex; 
            align-items: center; gap: 6px; transition: 0.3s; white-space: nowrap; flex-shrink: 0;
        }
        .btn-outline-copy i { font-size: 12px; transition: 0.3s; }
        .btn-outline-copy:hover { background-color: #CC0000; color: #FFF; border-color: #CC0000; box-shadow: 0 0 15px rgba(204, 0, 0, 0.4);}
        
        .btn-whatsapp {
            display: flex; justify-content: center; align-items: center; gap: 10px;
            background: linear-gradient(135deg, #a30000 0%, #ff1a1a 100%); 
            color: #FFF; text-decoration: none; 
            padding: 20px; border-radius: 14px; font-size: 13px; font-weight: 800; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid rgba(255, 51, 51, 0.5);
            animation: pulseRed 2.5s infinite alternate;
        }
        @keyframes pulseRed {
            0% { box-shadow: 0 5px 15px rgba(204, 0, 0, 0.3); }
            100% { box-shadow: 0 10px 30px rgba(255, 26, 26, 0.6); }
        }
        .btn-whatsapp:hover { transform: scale(1.02); filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="app-container">
        
        <div class="header">
            <div class="logo-wrapper">
                <div class="logo-circle">
                    <img src="https://i.ibb.co/tMk5B6my/file-00000000ea70722fa6af0f9278e50248.png" alt="Sergio Zaldivar">
                </div>
            </div>
        </div>

        <div class="virtual-card" data-tilt data-tilt-glare data-tilt-max-glare="0.2" data-tilt-max="10" data-tilt-speed="400" data-tilt-perspective="1000">
            <div class="vc-header">
                <span class="vc-bank">BBVA</span>
                <span class="vc-type">Débito</span>
            </div>
            <div class="vc-number-row">
                <div class="vc-number">4152 3146 4966 4979</div>
            </div>
            <div class="vc-footer">
                <div>
                    <div class="vc-holder-label">Titular de la cuenta</div>
                    <div class="vc-holder-name">Sergio A. Zaldivar León</div>
                </div>
                <div><i class="fa-brands fa-cc-visa" style="font-size: 26px; color: #FFF; opacity: 0.9;"></i></div>
            </div>
        </div>

        <div class="data-section">
            <div class="section-title"><i class="fa-solid fa-wallet"></i> DATOS DE PAGO</div>

            <div class="data-row">
                <div class="data-text">
                    <span class="data-label">Número de Tarjeta</span>
                    <span class="data-value">4152314649664979</span>
                </div>
                <button class="btn-outline-copy" onclick="copiarTexto('4152314649664979', this)">
                    <i class="fa-regular fa-copy"></i> Copiar
                </button>
            </div>

            <div class="data-row">
                <div class="data-text">
                    <span class="data-label">Cuenta CLABE</span>
                    <span class="data-value">012910015374051353</span>
                </div>
                <button class="btn-outline-copy" onclick="copiarTexto('012910015374051353', this)">
                    <i class="fa-regular fa-copy"></i> Copiar
                </button>
            </div>

            <div class="data-row">
                <div class="data-text">
                    <span class="data-label">Beneficiario</span>
                    <span class="data-value" style="font-family: 'Montserrat', sans-serif; word-break: normal;">Sergio Andres Zaldivar Leon</span>
                </div>
                <button class="btn-outline-copy" onclick="copiarTexto('Sergio Andres Zaldivar Leon', this)">
                    <i class="fa-regular fa-copy"></i> Copiar
                </button>
            </div>
        </div>

        <a href="https://wa.me/529992438223?text=Hola%20Sergio,%20te%20envío%20mi%20comprobante%20de%20pago" target="_blank" class="btn-whatsapp">
            <i class="fa-brands fa-whatsapp" style="font-size: 20px;"></i> Enviar Comprobante
        </a>
    </div>

    <!-- Script de Micro-interacción 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    
    <script>
        function copiarTexto(texto, elemento) {
            navigator.clipboard.writeText(texto).then(() => {
                let textoOriginal = elemento.innerHTML;
                elemento.innerHTML = "<i class='fa-solid fa-check'></i>";
                elemento.style.backgroundColor = "#CC0000"; 
                elemento.style.borderColor = "#CC0000";
                elemento.style.color = "#FFF";
                elemento.style.transform = "scale(1.1)";
                
                setTimeout(() => { 
                    elemento.innerHTML = textoOriginal;
                    elemento.style.backgroundColor = "rgba(212, 175, 55, 0.05)"; 
                    elemento.style.borderColor = "#D4AF37";
                    elemento.style.color = "#D4AF37";
                    elemento.style.transform = "scale(1)";
                }, 1500);
            });
        }
    </script>
</body>
</html>
